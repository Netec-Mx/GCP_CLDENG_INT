# _data/courses.yml
gcp_cldeng_int:
  title: "Cloud Engineer" # COLOCAR EL NOMBRE DEL CURSO
  intro: "Cada laboratorio está diseñado para una experiencia práctica. Haz clic para comenzar."
  labs:

    - id: lab1 
      title: "Simular cuentas de facturación con datos ficticios"
      url:  "/lab1/lab1/"
      duration: "30 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Simular export de Cloud Billing a BigQuery con datos ficticios para analizar costos por cuenta, servicio y proyecto." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab2 
      title: "Crear VM en Compute Engine y conectarla por IAP (Identity-Aware Proxy)"
      url:  "/lab2/lab2/"
      duration: "45 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Crear VM privada sin IP pública y acceder por IAP (SSH/túnel) para desplegar y ver un contenedor web con port-forwarding." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab3 
      title: "Crear bucket en Cloud Storage con versionado y ciclo de vida"
      url:  "/lab3/lab3/"
      duration: "30 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Crear bucket en Cloud Storage con versionado y lifecycle para retener solo versiones útiles y reducir costos." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab4 
      title: "Crear VPC con 2 subredes, firewall y balanceo de carga interno"
      url:  "/lab4/lab4/"
      duration: "45 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Diseñar VPC custom con 2 subredes, firewall mínimo y un ILB TCP interno hacia un MIG, validando en UI y CLI." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab5 
      title: "Implementar Cloud SQL y conectarlo con una VM de aplicación"
      url:  "/lab5/lab5/"
      duration: "50 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Implementar Cloud SQL MySQL con IP privada, VM en la misma VPC y conexión segura vía Cloud SQL Auth Proxy con app web." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab6 
      title: "Crear grupo administrado con autoescalado y health checks"
      url:  "/lab6/lab6/"
      duration: "45 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Crear MIG desde template con autoscaling y autohealing, acceso por IAP a VMs privadas y validación de escalado/recuperación." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab7 
      title: "Configurar balanceador global con certificado SSL administrado"
      url:  "/lab7/lab7/"
      duration: "45 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Configurar HTTPS Load Balancer global con SSL administrado por Google para una app en MIG, validando salud, HTTPS y certificado." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab8 
      title: "Desplegar app contenedorizada en GKE y exponer con Ingress"
      url:  "/lab8/lab8/"
      duration: "60 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Desplegar app en GKE con imagen en Artifact Registry, crear Deployment/Service y exponer con Ingress GCE y LB global." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab9 
      title: "Conectar Pub/Sub con Cloud Function para procesamiento de eventos"
      url:  "/lab9/lab9/"
      duration: "40 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Implementar flujo event-driven: Pub/Sub activa Cloud Function (Cloud Run) que procesa mensaje y registra en Logging, validando end-to-end." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab10 
      title: "Crear snapshot de VM y restaurarla en otra zona"
      url:  "/lab10/lab10/"
      duration: "40 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Crear VM, tomar snapshot del boot disk y restaurarlo en otra zona para levantar una segunda VM conservando datos." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab11 
      title: "Crear tablero en Monitoring con métricas de CPU y alertas"
      url:  "/lab11/lab11/"
      duration: "40 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Crear VM, armar dashboard de CPU en Cloud Monitoring y configurar alerta con notificación, validando al generar carga e incidentes." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab12 
      title: "Analizar logs de error de app en GKE y exportarlos a BigQuery"
      url:  "/lab12/lab12/"
      duration: "30 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Crear GKE Autopilot, analizar errores en Cloud Logging y exportar logs a BigQuery con sink, validando con SQL." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab13 
      title: "Crear rol personalizado con privilegio mínimo y asignar a un usuario"
      url:  "/lab13/lab13/"
      duration: "45 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Crear un rol IAM personalizado de solo lectura para VMs y asignarlo a un usuario, validando acceso con Troubleshooter." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab14 
      title: "Configurar Workload Identity en GKE para evitar uso de claves"
      url:  "/lab14/lab14/"
      duration: "45 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Configurar Workload Identity en GKE Autopilot para acceder a Cloud Storage sin llaves, validando KSA→GSA y permisos mínimos." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

    - id: lab15 
      title: "Proteger datos sensibles con VPC Service Controls y validar acceso"
      url:  "/lab15/lab15/"
      duration: "30 min" # AJUSTAR TIEMPO DE LA PRACTICA
      desc: "Configurar VPC Service Controls para proteger Cloud Storage: probar en Dry-run, aplicar Enforced y permitir acceso con Access Level por IP." # DESCRIPCION BREVE DE LA PRACTICA 100-120 CARACTERES

